# 微金100 Nginx 过渡版：证书还没到位时用（只开 80，不跳 HTTPS）。
# 小程序正式版必须走 HTTPS，此配置仅用于服务器自测 / 申请证书。
# 启用：.env 里 NGINX_CONF=nginx.http.conf；证书到位后删掉该行改回默认 nginx.conf。

upstream weijin_api {
    server backend:3100;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location /api/ {
        proxy_pass http://weijin_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://weijin_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /uploads/listing/ {
        alias /data/uploads/listing/;
        expires 7d;
    }
    location /uploads/avatar/ {
        alias /data/uploads/avatar/;
        expires 7d;
    }
}
