# 微金100 Nginx（单 ECS 120.76.243.108）：HTTPS 反代 + WebSocket + 商品图静态
# 域名 api.weijin99.com；证书放宿主 /data/certs/（见 deploy/README.md）。
# 证件等敏感文件不在此暴露，走后端鉴权下载接口。

upstream weijin_api {
    server backend:3100;
}

# HTTP：全部跳 HTTPS（ACME 文件校验除外）
server {
    listen 80;
    server_name api.weijin99.com;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.weijin99.com;

    ssl_certificate     /etc/nginx/certs/api.weijin99.com.pem;
    ssl_certificate_key /etc/nginx/certs/api.weijin99.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 10m; # 证件/商品图上传

    location /api/ {
        proxy_pass http://weijin_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /ws/ {
        proxy_pass http://weijin_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # 仅商品图/头像公开；证件、仲裁证据、申诉材料走 /api 鉴权下载
    location /uploads/listing/ {
        alias /data/uploads/listing/;
        expires 7d;
    }
    location /uploads/avatar/ {
        alias /data/uploads/avatar/;
        expires 7d;
    }

    location / {
        return 404;
    }
}
